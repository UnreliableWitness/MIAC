<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MIAC</title>
    <link rel="icon" href="/assets/icon/png/32.png" />
  </head>
  <body>
    <main class="sp" id="sp">
      <div class="neb" id="neb"></div>
      <div class="stars"></div>
      <div class="scan"></div>
      <div class="center">
        <svg width="170" height="170" viewBox="0 0 200 200" aria-hidden="true">
          <defs>
            <radialGradient id="g" cx="50%" cy="50%" r="50%">
              <stop offset="0" stop-color="#ffd08a" />
              <stop offset=".35" stop-color="#f0a443" stop-opacity=".75" />
              <stop offset="1" stop-color="#f0a443" stop-opacity="0" />
            </radialGradient>
          </defs>
          <circle
            cx="100"
            cy="100"
            r="80"
            fill="none"
            stroke="#1d2230"
            stroke-width="1"
          />
          <circle
            class="ring ticks"
            cx="100"
            cy="100"
            r="80"
            fill="none"
            stroke="#f0a443"
            stroke-width="2.5"
            transform="rotate(-90 100 100)"
          />
          <circle
            class="ring arc"
            cx="100"
            cy="100"
            r="80"
            fill="none"
            stroke="#f0a443"
            stroke-width="5"
            stroke-linecap="round"
            transform="rotate(-90 100 100)"
          />
          <text class="counter" id="cnt" x="100" y="108" text-anchor="middle">
            0000
          </text>
          <circle class="bloom" cx="100" cy="100" r="52" fill="url(#g)" />
          <g class="core">
            <circle cx="100" cy="100" r="22" fill="#f6e7c8" />
            <circle cx="94" cy="94" r="8" fill="#fff" opacity=".7" />
          </g>
        </svg>
        <div class="word" aria-label="MIAC">
          <span>M</span><span>I</span><span>A</span><span>C</span>
        </div>
        <div class="tag">ME, I'M COUNTING</div>
      </div>
      <div class="rule"></div>
      <div class="status">
        <span
          ><b>&rsaquo;</b> <span id="step" role="status">Starting</span></span
        ><span id="ver"></span>
      </div>
      <div class="fail" id="fail" hidden>
        <span id="failmsg"></span><button type="button" id="quit">Quit</button>
      </div>
    </main>
    <script type="module" src="/src/splash/splash.ts"></script>
  </body>
</html>
