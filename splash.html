<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MIAC</title>
    <link rel="icon" href="./assets/icon/png/32.png" />
  </head>
  <body>
    <main class="sp" id="sp">
      <div class="center">
        <img
          class="mark"
          src="./assets/icon/png/128.png"
          width="64"
          height="64"
          alt=""
        />
        <div class="word">MIAC</div>
        <div class="bar" aria-hidden="true"><span></span></div>
        <div class="step" id="step" role="status">Starting</div>
      </div>
      <div class="ver" id="ver"></div>
      <div class="fail" id="fail" hidden>
        <span id="failmsg"></span><button type="button" id="quit">Quit</button>
      </div>
    </main>
    <script type="module" src="/src/splash/splash.ts"></script>
  </body>
</html>
