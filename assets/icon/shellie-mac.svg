<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- macOS, 64 px and up: the trimaran on a deep-space tile at Apple's icon grid (824 of 1024, centred),
       with a soft shadow below the tile like other Dock icons. -->
  <defs>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123a66"/>
      <stop offset="1" stop-color="#061427"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2b88d8" stop-opacity=".28"/>
      <stop offset="1" stop-color="#2b88d8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope=".3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tile"><rect x="50" y="50" width="412" height="412" rx="92"/></clipPath>
  </defs>
  <rect x="50" y="50" width="412" height="412" rx="92" fill="url(#deep)" filter="url(#shadow)"/>
  <g clip-path="url(#tile)">
    <circle cx="256" cy="256" r="190" fill="url(#glow)"/>
    <g fill="#fff">
      <circle cx="122" cy="138" r="4.5" opacity=".75"/>
      <circle cx="204" cy="94" r="3" opacity=".55"/>
      <circle cx="100" cy="264" r="3" opacity=".45"/>
      <circle cx="146" cy="396" r="3.5" opacity=".55"/>
      <circle cx="296" cy="420" r="3" opacity=".6"/>
      <circle cx="414" cy="340" r="4.5" opacity=".65"/>
      <circle cx="420" cy="204" r="2.5" opacity=".5"/>
    </g>
  </g>
  <g transform="rotate(35 256 256) translate(256 256) scale(.64) translate(-256 -250)">
    <polygon points="238,236 238,306 172,372 172,300" fill="#005ba1"/>
    <polygon points="274,236 274,306 340,372 340,300" fill="#003a6c"/>
    <polygon points="166,166 146,240 154,412 166,412" fill="#2b88d8"/>
    <polygon points="166,166 186,240 178,412 166,412" fill="#0f6cbd"/>
    <polygon points="346,166 326,240 334,412 346,412" fill="#0f6cbd"/>
    <polygon points="346,166 366,240 358,412 346,412" fill="#004e8c"/>
    <polygon points="256,16 228,150 236,466 256,466" fill="#cfe6fb"/>
    <polygon points="256,16 284,150 276,466 256,466" fill="#2b88d8"/>
    <g fill="#cfe6fb">
      <ellipse cx="166" cy="420" rx="14" ry="7"/>
      <ellipse cx="346" cy="420" rx="14" ry="7"/>
      <ellipse cx="256" cy="474" rx="20" ry="9"/>
    </g>
  </g>
</svg>
