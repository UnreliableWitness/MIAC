<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- macOS, 64 px and up: the conch on Apple's icon grid (824 of 1024, centred), with a soft shadow below
       the tile like other Dock icons. -->
  <defs>
    <clipPath id="tile"><rect x="50" y="50" width="412" height="412" rx="92"/></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope=".3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="50" y="50" width="412" height="412" rx="92" fill="#0f1a2e" filter="url(#shadow)"/>
  <image href="shellie-art.jpg" x="32.5" y="32.5" width="446.9" height="446.9" clip-path="url(#tile)"/>
</svg>
