<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- For 16-32 px: bars are 64 units (2 px at 16 px) on the pixel grid, with square ends. -->
  <defs>
    <linearGradient id="slash" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#50e6ff"/><stop offset="1" stop-color="#0078d4"/></linearGradient>
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <path d="M40 384 L472 128" stroke="#000" stroke-width="150" stroke-linecap="round"/>
    </mask>
  </defs>
  <g mask="url(#gap)">
    <rect x="32" y="64" width="64" height="384" fill="#0063b1"/>
    <rect x="160" y="64" width="64" height="384" fill="#0f6cbd"/>
    <rect x="288" y="64" width="64" height="384" fill="#1a7fd0"/>
    <rect x="416" y="64" width="64" height="384" fill="#2b88d8"/>
  </g>
  <path d="M40 384 L472 128" stroke="url(#slash)" stroke-width="72" stroke-linecap="round"/>
</svg>
